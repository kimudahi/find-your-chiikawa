<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>먼작귀 심리 테스트</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e3f2fd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 16px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(2, 119, 189, 0.08);
      text-align: center;
      position: relative;
    }

    .start-card { display: block; }
    
    .cover-img-box {
      width: 220px;
      height: 220px;
      margin: 16px auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      outline: none;
    }

    .cover-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      border: none;
      outline: none;
    }

    .cover-badge {
      display: inline-block;
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .cover-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .cover-desc {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .quiz-card { display: none; }

    .progress-container {
      width: 100%;
      background-color: #e1f5fe;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #039be5;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 13px;
      color: #0277bd;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .btn-option {
      width: 100%;
      background-color: #f8f9fa;
      border: 1.5px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.35;
      word-break: keep-all;
      text-align: left;
    }

    .btn-option:active, .btn-option:hover {
      background-color: #e1f5fe;
      border-color: #b3e5fc;
      color: #0277bd;
    }

    .result-card { display: none; }

    .char-img-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(2, 119, 189, 0.15));
    }

    .sub-title { font-size: 14px; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
    .main-title { font-size: 26px; color: #1a1a1a; font-weight: 800; margin-bottom: 12px; }

    .tag-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
    }

    .quote-box {
      background-color: #f0f9ff !important;
      border: 2px solid #0288d1 !important;
      border-radius: 18px !important;
      padding: 16px 20px !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      color: #01579b !important;
      margin-bottom: 18px !important;
      text-align: center !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.08) !important;
    }

    /* 서머리 박스 영역 */
    .summary-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 14px;
      text-align: left;
    }

    .summary-line {
      font-size: 13.5px;
      line-height: 1.6;
      color: #334155;
      word-break: keep-all;
      margin-bottom: 10px;
      position: relative;
      padding-left: 14px;
    }

    .summary-line:last-child { margin-bottom: 0; }

    .summary-line::before {
      content: "•";
      position: absolute;
      left: 2px;
      top: 0;
      color: #0288d1;
      font-weight: bold;
    }

    .summary-line strong {
      color: #0277bd;
      font-weight: 800;
    }

    /* 스탯 바 섹션 */
    .stat-section {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 22px;
      text-align: left;
    }

    .stat-item { margin-bottom: 12px; }
    .stat-item:last-child { margin-bottom: 0; }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 6px;
    }

    .stat-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #0288d1);
      border-radius: 10px;
      width: 0%;
      transition: width 0.6s ease-in-out;
    }

    .info-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .info-item {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-label {
      font-size: 12px;
      font-weight: 800;
      color: #0277bd;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .info-value {
      font-size: 13.5px;
      color: #1f2937;
      font-weight: 700;
      word-break: keep-all;
    }

    .chemistry-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .chem-item {
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .chem-item.best { background-color: #f0fdf4; border: 1px solid #bbf7d0; }
    .chem-item.tikitaka { background-color: #fff1f2; border: 1px solid #fecdd3; }

    .chem-label {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chem-item.best .chem-label { color: #166534; }
    .chem-item.tikitaka .chem-label { color: #9f1239; }

    .chem-value {
      font-size: 13.5px;
      font-weight: 700;
      color: #1f2937;
      word-break: keep-all;
    }

    .share-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main-share {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main-share:active { transform: scale(0.98); }
    
    .btn-kakao-primary { background-color: #FEE500; color: #191919; }
    .btn-link-primary { background-color: #039be5; color: #ffffff; }

    .btn-restart {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      background-color: #e1f5fe;
      color: #0277bd;
      border: none;
      cursor: pointer;
    }

    .sub-sns-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-sub-sns {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .btn-sub-sns:active { transform: scale(0.92); }
    .btn-sub-sns svg { width: 20px; height: 20px; fill: currentColor; }

    .btn-sub-sns.twitter { background-color: #000000; color: #ffffff; }
    .btn-sub-sns.facebook { background-color: #1877f2; color: #ffffff; }
    .btn-sub-sns.naver { background-color: #03cf5d; color: #ffffff; }

    @media (max-width: 380px) {
      .container { padding: 24px 16px; }
      .cover-title { font-size: 21px; }
      .cover-img-box { width: 180px; height: 180px; }
      .q-text { font-size: 16px; }
      .main-title { font-size: 22px; }
      .btn-option { padding: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-view" class="start-card">
      <span class="cover-badge">먼작귀 심리 테스트</span>
      <h1 class="cover-title">나와 닮은 먼작귀 캐릭터 찾기</h1>
      <div class="cover-img-box">
        <img src="./main.gif" alt="먼작귀 커버">
      </div>
      <p class="cover-desc">먼가 작고 귀여운 녀석들 중에서<br>나와 닮은 캐릭터를 확인해 보세요!</p>
      <button class="btn-main-share btn-link-primary" onclick="startTest()">시작해 보자구!</button>
    </div>

    <div id="quiz-view" class="quiz-card">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="q-number" id="q-number">Q1</div>
      <div class="q-text" id="q-text">질문 텍스트</div>
      <div id="answer-buttons"></div>
    </div>

    <div id="result-view" class="result-card">
      <div class="char-img-box">
        <img id="res-img" src="" alt="캐릭터 이미지">
      </div>
      <p class="sub-title" id="res-sub"></p>
      <h1 class="main-title" id="res-name"></h1>
      <div class="tag-container" id="res-tags"></div>
      <div class="quote-box" id="res-quote"></div>

      <!-- 서머리 박스 영역 -->
      <div class="summary-box" id="res-summary"></div>

      <!-- 먼작귀 세계관 생존 스탯 -->
      <div class="stat-section">
        <div class="stat-item">
          <div class="stat-header">
            <span>⚔️ 토벌 능력</span>
            <span id="stat-combat-val">0%</span>
          </div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-combat-bar"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-header">
            <span>🍀 생존 운</span>
            <span id="stat-luck-val">0%</span>
          </div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-luck-bar"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-header">
            <span>🎀 귀여움</span>
            <span id="stat-cute-val">0%</span>
          </div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-cute-bar"></div></div>
        </div>
      </div>

      <div class="info-section">
        <div class="info-item">
          <span class="info-label">🍀 행운의 아이템</span>
          <p class="info-value" id="res-item"></p>
        </div>
        <div class="info-item">
          <span class="info-label">🍮 힐링 푸드</span>
          <p class="info-value" id="res-food"></p>
        </div>
      </div>

      <div class="chemistry-section">
        <div class="chem-item best">
          <span class="chem-label">💖 베스트 프렌드</span>
          <p class="chem-value" id="res-best"></p>
        </div>
        <div class="chem-item tikitaka">
          <span class="chem-label">⚡ 환장의 티키타카</span>
          <p class="chem-value" id="res-tiki"></p>
        </div>
      </div>

      <div class="share-section">
        <button class="btn-main-share btn-kakao-primary" onclick="shareKakao()">
          친구에게 공유하기
        </button>
        <button class="btn-main-share btn-link-primary" onclick="copyLink()">
          테스트 링크 복사
        </button>
        <button class="btn-restart" onclick="restartTest()">다시 테스트하기</button>

        <div class="sub-sns-group">
          <button class="btn-sub-sns twitter" onclick="shareTwitter()" title="X(트위터) 공유">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </button>
          <button class="btn-sub-sns facebook" onclick="shareFacebook()" title="페이스북 공유">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <button class="btn-sub-sns naver" onclick="shareNaver()" title="네이버 공유">
            <svg viewBox="0 0 24 24"><path d="M16.273 12.845L7.376 0H0v24h7.726v-12.845L16.624 24H24V0h-7.727z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const JAVASCRIPT_KEY = '45851354763e4eb82596527c8f662c33';

    if (window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(JAVASCRIPT_KEY);
    }

    const questions = [
      {
        q: "기다리던 주말, 나만의 힐링 방법은?",
        a: [
          { text: "아늑한 방에서 혼자 조용히 휴식을 취해요", char: "chiikawa" },
          { text: "친구들과 함께 웃고 떠들며 추억을 만들어요", char: "hachiware" },
          { text: "특별한 계획이 없어도 일단 밖으로 나가요", char: "usagi" },
          { text: "맛있는 음식을 잔뜩 먹으며 느긋하게 즐겨요", char: "kurimanju" }
        ]
      },
      {
        q: "두렵고 막막한 일이 생겼을 때 나의 행동은?",
        a: [
          { text: "겁은 나지만 소중한 사람들을 생각하며 용기를 내요", char: "chiikawa" },
          { text: "“어떻게든 될 거야!” 라며 긍정적인 마인드로 이겨내요", char: "hachiware" },
          { text: "무섭고 힘들지만, 일단 꾹 참고 최선을 다해요", char: "shisa" },
          { text: "냉정함을 유지하고 문제의 원인을 깔끔하게 해결해요", char: "rakko" }
        ]
      },
      {
        q: "여러 친구들과 함께 있을 때 나의 모습은?",
        a: [
          { text: "대화를 주도하고 친구들을 다정하게 챙겨요", char: "hachiware" },
          { text: "나만의 존재감과 매력을 당당하게 어필해요", char: "momonga" },
          { text: "이야기를 차분하게 듣고 실질적인 도움을 줘요", char: "kani" },
          { text: "말수는 적지만 뒤에서 든든하게 지켜줘요", char: "ode" }
        ]
      },
      {
        q: "인생에서 가장 큰 보람을 느끼는 순간은?",
        a: [
          { text: "주변 사람들의 관심과 칭찬을 받을 때", char: "momonga" },
          { text: "나의 정보나 조언이 타인에게 도움이 될 때", char: "kani" },
          { text: "시련을 극복하고 스스로 성장했다고 느낄 때", char: "rakko" },
          { text: "열심히 일한 만큼 성과를 인정받았을 때", char: "shisa" }
        ]
      },
      {
        q: "누군가 나에게 진심 어린 칭찬을 건넨다면?",
        a: [
          { text: "부끄러워서 얼굴이 빨개지지만 속으로는 기뻐해요", char: "chiikawa" },
          { text: "“더 칭찬해 봐!”라며 당당하게 요구해요", char: "momonga" },
          { text: "예의 바르게 감사하다는 말을 전해요", char: "shisa" },
          { text: "덤덤하고 태연한 얼굴로 고마움을 표해요", char: "ode" }
        ]
      },
      {
        q: "스트레스가 쌓였을 때 해소하는 방법은?",
        a: [
          { text: "맛있는 술과 안주로 피로를 털어버려요", char: "kurimanju" },
          { text: "신나는 춤과 노래로 에너지를 발산해요", char: "usagi" },
          { text: "달콤한 디저트를 먹으며 기분을 전환시켜요", char: "rakko" },
          { text: "조용한 곳에서 책을 읽으며 생각을 정리해요", char: "kani" }
        ]
      },
      {
        q: "낯선 사람들로 가득한 파티에서 나의 모습은?",
        a: [
          { text: "먼저 다가가서 친근하게 인사를 건네요", char: "hachiware" },
          { text: "남들의 시선은 신경쓰지 않고 자유롭게 행동해요", char: "usagi" },
          { text: "구석에서 분위기를 살피며 서서히 적응해요", char: "chiikawa" },
          { text: "나서지 않고 제자리에 가만히 앉아 있어요", char: "ode" }
        ]
      },
      {
        q: "새로운 취미 활동을 시작해야 한다면?",
        a: [
          { text: "자격증까지 딸 수 있는 실용적인 취미를 가져요", char: "shisa" },
          { text: "근사한 요리나 음료를 만드는 법을 배워요", char: "kurimanju" },
          { text: "혼자서도 즐길 수 있는 정적인 활동을 해요", char: "kani" },
          { text: "체력을 키우고 자신감을 얻을 수 있는 운동을 배워요", char: "rakko" }
        ]
      },
      {
        q: "좋아하는 사람에게 마음을 전하는 방법은?",

    let currentQ = 0;

      chiikawa: 0, hachiware: 0, usagi: 0,
      momonga: 0, kurimanju: 0, rakko: 0,
      shisa: 0, kani: 0, ode: 0
    };
    let currentResultData = null;

    function startTest() {
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('q-number').innerText = `Q${currentQ + 1}`;
      document.getElementById('q-text').innerText = q.q;
      document.getElementById('progress-bar').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const btnContainer = document.getElementById('answer-buttons');
      btnContainer.innerHTML = '';

      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${idx + 1}. ${ans.text}`;
        btn.onclick = () => selectAnswer(ans.char);
        btnContainer.appendChild(btn);
      });
    }

    function selectAnswer(targetChar) {
      if (charScores[targetChar] !== undefined) {
        charScores[targetChar] += 1;
      }

      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      let selectedCharKey = 'chiikawa';
      let maxScore = -1;

      for (let charKey in charScores) {
        if (charScores[charKey] > maxScore) {
          maxScore = charScores[charKey];
          selectedCharKey = charKey;
        }
      }

      currentResultData = results[selectedCharKey] || results.chiikawa;

      document.getElementById('res-img').src = currentResultData.img;
      document.getElementById('res-sub').innerText = currentResultData.title;
      document.getElementById('res-name').innerText = currentResultData.name;
      document.getElementById('res-quote').innerText = currentResultData.quote;
      
      // 서머리 마크다운 파싱 및 박스 바인딩
      const summaryBox = document.getElementById('res-summary');
      summaryBox.innerHTML = '';
      const lines = currentResultData.summary.split('\n');
      lines.forEach(line => {
        if (line.trim() !== '') {
          const formattedLine = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          const p = document.createElement('p');
          p.className = 'summary-line';
          p.innerHTML = formattedLine;
          summaryBox.appendChild(p);
        }
      });

      // 스탯 데이터 바인딩 및 애니메이션 효과
      const stats = currentResultData.stats || { combat: 50, luck: 50, cute: 50 };
      document.getElementById('stat-combat-val').innerText = `${stats.combat}%`;
      document.getElementById('stat-luck-val').innerText = `${stats.luck}%`;
      document.getElementById('stat-cute-val').innerText = `${stats.cute}%`;

      // 게이지 초기화 후 바 채우기
      document.getElementById('stat-combat-bar').style.width = '0%';
      document.getElementById('stat-luck-bar').style.width = '0%';
      document.getElementById('stat-cute-bar').style.width = '0%';

      setTimeout(() => {
        document.getElementById('stat-combat-bar').style.width = `${stats.combat}%`;
        document.getElementById('stat-luck-bar').style.width = `${stats.luck}%`;
        document.getElementById('stat-cute-bar').style.width = `${stats.cute}%`;
      }, 100);

      document.getElementById('res-item').innerText = currentResultData.item;
      document.getElementById('res-food').innerText = currentResultData.food;
      document.getElementById('res-best').innerText = currentResultData.best;
      document.getElementById('res-tiki').innerText = currentResultData.tikitaka;

      const tagsContainer = document.getElementById('res-tags');
      tagsContainer.innerHTML = '';
      currentResultData.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = tag;
        tagsContainer.appendChild(span);
      });
    }

    function shareKakao() {
      if (!window.Kakao) {
        alert('카카오 SDK를 불러오지 못했습니다.');
        return;
      }
    
      const data = currentResultData || results.chiikawa;
      const siteUrl = window.location.href;
      const absoluteImageUrl = new URL(data.img, window.location.href).href;
    
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `나와 닮은 먼작귀 캐릭터는 ${data.name}!`,
          imageUrl: absoluteImageUrl,
          imageWidth: 400,
          imageHeight: 400,
          link: { mobileWebUrl: siteUrl, webUrl: siteUrl }

        buttons: [
          { title: '나도 테스트해보기', link: { mobileWebUrl: siteUrl, webUrl: siteUrl } }
        ]
      });
    }

        alert('복사 실패! 주소창에서 직접 복사해 주세요.');

    }

    function restartTest() {
      currentQ = 0;
      for (let key in charScores) {

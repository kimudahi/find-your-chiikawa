<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>먼작귀 심리 테스트</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e3f2fd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 16px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(2, 119, 189, 0.08);
      text-align: center;
      position: relative;
    }

    .start-card { display: block; }
    
    /* 메인 커버 이미지 박스 및 스타일 수정 */
    .cover-img-box {
      width: 220px;
      height: 220px;
      margin: 16px auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      outline: none;
    }

    .cover-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none; /* 경계선 및 그림자 효과 제거 */
      border: none;
      outline: none;
    }

    .cover-badge {
      display: inline-block;
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .cover-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .cover-desc {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .quiz-card { display: none; }

    .progress-container {
      width: 100%;
      background-color: #e1f5fe;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #039be5;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 13px;
      color: #0277bd;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .btn-option {
      width: 100%;
      background-color: #f8f9fa;
      border: 1.5px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.35;
      word-break: keep-all;
      text-align: left;
    }

    .btn-option:active, .btn-option:hover {
      background-color: #e1f5fe;
      border-color: #b3e5fc;
      color: #0277bd;
    }

    .result-card { display: none; }

    .char-img-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(2, 119, 189, 0.15));
    }

    .sub-title { font-size: 14px; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
    .main-title { font-size: 26px; color: #1a1a1a; font-weight: 800; margin-bottom: 12px; }

    .tag-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
    }

    .quote-box {
      background-color: #f0f9ff !important;
      border: 2px solid #0288d1 !important;
      border-radius: 18px !important;
      padding: 16px 20px !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      color: #01579b !important;
      margin-bottom: 18px !important;
      text-align: center !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.08) !important;
    }

    .summary-text {
      font-size: 14px;
      line-height: 1.65;
      color: #374151;
      margin-bottom: 22px;
      word-break: keep-all;
      text-align: left;
    }

    .info-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-item {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-label {
      font-size: 12px;
      font-weight: 800;
      color: #0277bd;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .info-value {
      font-size: 13.5px;
      color: #1f2937;
      font-weight: 700;
      word-break: keep-all;
    }

    .chemistry-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .chem-box { border-radius: 16px; padding: 14px 16px; text-align: left; }
    .chem-box.best { background-color: #f0fdf4; border: 1px solid #bbf7d0; }
    .chem-box.tikitaka { background-color: #fff1f2; border: 1px solid #fecdd3; }
    .chem-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .chem-box.best .chem-title { color: #166534; }
    .chem-box.tikitaka .chem-title { color: #9f1239; }
    .chem-desc { font-size: 13px; color: #374151; line-height: 1.4; }

    .share-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main-share {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main-share:active { transform: scale(0.98); }
    
    .btn-kakao-primary { background-color: #FEE500; color: #191919; }
    .btn-link-primary { background-color: #039be5; color: #ffffff; }

    .btn-restart {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      background-color: #e1f5fe;
      color: #0277bd;
      border: none;
      cursor: pointer;
    }

    .sub-sns-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-sub-sns {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .btn-sub-sns:active { transform: scale(0.92); }
    .btn-sub-sns svg { width: 20px; height: 20px; fill: currentColor; }

    .btn-sub-sns.twitter { background-color: #000000; color: #ffffff; }
    .btn-sub-sns.facebook { background-color: #1877f2; color: #ffffff; }
    .btn-sub-sns.naver { background-color: #03cf5d; color: #ffffff; }

    @media (max-width: 380px) {
      .container { padding: 24px 16px; }
      .cover-title { font-size: 21px; }
      .cover-img-box { width: 180px; height: 180px; }
      .q-text { font-size: 16px; }
      .main-title { font-size: 22px; }
      .btn-option { padding: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-view" class="start-card">
      <span class="cover-badge">먼작귀 심리 테스트</span>
      <h1 class="cover-title">나와 닮은 먼작귀 캐릭터 찾기</h1>
      <div class="cover-img-box">
        <img src="./main.gif" alt="먼작귀 커버">
      </div>
      <p class="cover-desc">먼가 작고 귀여운 녀석들 중에서<br>나와 닮은 캐릭터를 확인해 보세요!</p>
      <button class="btn-main-share btn-link-primary" onclick="startTest()">시작해 보자구!</button>
    </div>

    <div id="quiz-view" class="quiz-card">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="q-number" id="q-number">Q1</div>
      <div class="q-text" id="q-text">질문 텍스트</div>
      <div id="answer-buttons"></div>
    </div>

    <div id="result-view" class="result-card">
      <div class="char-img-box">
        <img id="res-img" src="" alt="캐릭터 이미지">
      </div>
      <p class="sub-title" id="res-sub"></p>
      <h1 class="main-title" id="res-name"></h1>
      <div class="tag-container" id="res-tags"></div>
      <div class="quote-box" id="res-quote"></div>
      <p class="summary-text" id="res-summary"></p>

      <div class="info-section">
        <div class="info-item">
          <span class="info-label">🍀 행운의 아이템</span>
          <p class="info-value" id="res-item"></p>
        </div>
        <div class="info-item">
          <span class="info-label">🍮 힐링 푸드</span>
          <p class="info-value" id="res-food"></p>
        </div>
      </div>

      <div class="chemistry-section">
        <div class="chem-box best">
          <div class="chem-title" id="res-best-title"></div>
          <div class="chem-desc">보기만 해도 마음이 몽글몽글해지는 소울메이트</div>
        </div>
        <div class="chem-box tikitaka">
          <div class="chem-title" id="res-tiki-title"></div>
          <div class="chem-desc" id="res-tiki-desc"></div>
        </div>
      </div>

      <div class="share-section">
        <button class="btn-main-share btn-kakao-primary" onclick="shareKakao()">
          친구에게 공유하기
        </button>
        <button class="btn-main-share btn-link-primary" onclick="copyLink()">
          테스트 링크 복사
        </button>
        <button class="btn-restart" onclick="restartTest()">다시 테스트하기</button>

        <div class="sub-sns-group">
          <button class="btn-sub-sns twitter" onclick="shareTwitter()" title="X(트위터) 공유">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </button>
          <button class="btn-sub-sns facebook" onclick="shareFacebook()" title="페이스북 공유">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <button class="btn-sub-sns naver" onclick="shareNaver()" title="네이버 공유">
            <svg viewBox="0 0 24 24"><path d="M16.273 12.845L7.376 0H0v24h7.726v-12.845L16.624 24H24V0h-7.727z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const JAVASCRIPT_KEY = '45851354763e4eb82596527c8f662c33';

    if (window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(JAVASCRIPT_KEY);
    }

    const questions = [
      {
        q: "기다리던 주말, 나만의 힐링 방법은?",
        a: [
          { text: "아늑한 방에서 혼자 조용히 휴식을 취해요", char: "chiikawa" },
          { text: "친구들과 함께 웃고 떠들며 추억을 만들어요", char: "hachiware" },
          { text: "특별한 계획 없이 즉흥적인 여행을 떠나요", char: "usagi" },
          { text: "맛있는 음식을 잔뜩 먹으며 느긋하게 즐겨요", char: "kurimanju" }
        ]
      },
      {
        q: "두렵고 막막한 일이 생겼을 때 나의 행동은?",
        a: [
          { text: "겁은 나지만 소중한 사람들을 생각하며 용기를 내요", char: "chiikawa" },
          { text: "“어떻게든 될 거야!” 라며 긍정적인 마인드로 이겨내요", char: "hachiware" },
          { text: "무섭고 힘들지만, 일단 꾹 참고 최선을 다해요", char: "shisa" },
          { text: "냉정함을 유지하고 문제의 원인을 깔끔하게 해결해요", char: "rakko" }
        ]
      },
      {
        q: "여러 친구들과 함께 있을 때 나의 모습은?",
        a: [
          { text: "대화를 주도하고 친구들을 다정하게 챙겨요", char: "hachiware" },
          { text: "나만의 존재감과 매력을 당당하게 어필해요", char: "momonga" },
          { text: "이야기를 차분하게 듣고 실질적인 도움을 줘요", char: "kani" },
          { text: "말수는 적지만 뒤에서 든든하게 지켜줘요", char: "ode" }
        ]
      },
      {
        q: "인생에서 가장 큰 보람을 느끼는 순간은?",
        a: [
          { text: "주변 사람들의 관심과 칭찬을 받을 때", char: "momonga" },
          { text: "나의 정보나 조언이 타인에게 도움이 될 때", char: "kani" },
          { text: "시련을 극복하고 스스로 성장했다고 느낄 때", char: "rakko" },
          { text: "열심히 일한 만큼 성과를 인정받았을 때", char: "shisa" }
        ]
      },
      {
        q: "누군가 나에게 진심 어린 칭찬을 건넨다면?",
        a: [
          { text: "쑥스러워서 얼굴이 빨개지지만 속으로 무척 기뻐한다.", char: "chiikawa" },
          { text: "“더 칭찬해 줘! 귀여워해 줘!” 하며 당당하게 요구한다.", char: "momonga" },
          { text: "“우레시-!” 예의 바르고 열정적으로 감사함을 표한다.", char: "shisa" },
          { text: "덤덤하고 의연하게 미소를 지으며 고마움을 표한다.", char: "ode" }
        ]
      },
      {
        q: "일상에서 스트레스가 차올랐을 때 나만의 해소법은?",
        a: [
          { text: "시원한 한 잔과 맛있는 안주로 느긋하게 시간을 보낸다.", char: "kurimanju" },
          { text: "에너지를 발산하며 기분 전환을 한다.", char: "usagi" },
          { text: "달콤한 고급 디저트를 먹으며 기분을 전환한다.", char: "rakko" },
          { text: "조용한 곳에서 책을 읽거나 잔잔히 마음을 정돈한다.", char: "kani" }
        ]
      },
      {
        q: "낯선 사람들이 모인 장소에 갔을 때 나의 모습은?",
        a: [
          { text: "먼저 다가가 인사를 건네며 친근하게 다가간다.", char: "hachiware" },
          { text: "주변 시선 신경 쓰지 않고 하고 싶은 대로 자유롭게 행동한다.", char: "usagi" },
          { text: "구석에서 조용히 상황을 살피며 천천히 적응한다.", char: "chiikawa" },
          { text: "묵묵히 자기 자리를 지키며 조용한 온정을 전한다.", char: "ode" }
        ]
      },
      {
        q: "여행을 계획할 때 내가 선호하는 방식은?",
        a: [
          { text: "자격증 공부하듯 맛집부터 동선까지 알차게 체크한다.", char: "shisa" },
          { text: "현지의 유명 맛집과 술 한잔 기울일 곳을 우선 탐색한다.", char: "kurimanju" },
          { text: "조용하고 운치 있는 인근 서점이나 명소를 알아본다.", char: "kani" },
          { text: "큰 틀만 정해두고 발길 닿는 대로 유연하게 즐긴다.", char: "rakko" }
        ]
      },
      {
        q: "소중한 사람에게 내 마음을 표현하는 가장 자신 있는 방법은?",
        a: [
          { text: "따뜻한 말 한마디와 세심한 챙김으로 마음을 표현한다.", char: "hachiware" },
          { text: "말로 다 하기보다 무심한 듯 묵직하게 큰 힘이 되어준다.", char: "ode" },
          { text: "상대방에게 딱 필요한 유용한 정보나 책을 전해준다.", char: "kani" },
          { text: "솔직한 애교와 표현으로 솔직하게 다가간다.", char: "momonga" }
        ]
      },
      {
        q: "내가 생각하는 나의 가장 결정적인 매력 포인트는?",
        a: [
          { text: "여유롭고 어른스러운 낭만을 즐길 줄 아는 점", char: "kurimanju" },
          { text: "예측불가한 에너지와 뛰어난 순발력", char: "usagi" },
          { text: "목표를 위해 포기하지 않고 끝까지 노력하는 열정", char: "shisa" },
          { text: "자기관리에 철저하면서도 의외의 반전 귀여움이 있는 점", char: "rakko" }
        ]
      }
    ];

    const results = {
      chiikawa: {
        name: "치이카와", title: "소심하지만 용기 내는 순수파",
        tags: ["#순수함", "#소심하지만_용감해", "#귀여움"],
        quote: "“와... 와아...!”",

    let currentQ = 0;
    let charScores = {
      chiikawa: 0, hachiware: 0, usagi: 0,
      momonga: 0, kurimanju: 0, rakko: 0,
      shisa: 0, kani: 0, ode: 0
    };
    let currentResultData = null;

    function startTest() {
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('q-number').innerText = `Q${currentQ + 1}`;
      document.getElementById('q-text').innerText = q.q;
      document.getElementById('progress-bar').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const btnContainer = document.getElementById('answer-buttons');
      btnContainer.innerHTML = '';

      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${idx + 1}. ${ans.text}`;
        btn.onclick = () => selectAnswer(ans.char);
        btnContainer.appendChild(btn);
      });
    }

    function selectAnswer(targetChar) {
      if (charScores[targetChar] !== undefined) {
        charScores[targetChar] += 1;
      }

      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      let selectedCharKey = 'chiikawa';
      let maxScore = -1;

      for (let charKey in charScores) {
        if (charScores[charKey] > maxScore) {
          maxScore = charScores[charKey];
          selectedCharKey = charKey;
        }
      }

      currentResultData = results[selectedCharKey] || results.chiikawa;

      document.getElementById('res-img').src = currentResultData.img;
      document.getElementById('res-sub').innerText = currentResultData.title;
      document.getElementById('res-name').innerText = currentResultData.name;
      document.getElementById('res-quote').innerText = currentResultData.quote;
      document.getElementById('res-summary').innerText = currentResultData.summary;
      document.getElementById('res-item').innerText = currentResultData.item;
      document.getElementById('res-food').innerText = currentResultData.food;
      document.getElementById('res-best-title').innerText = `💖 BEST 짝꿍: ${currentResultData.best}`;
      document.getElementById('res-tiki-title').innerText = `⚡ 환장의 티키타카: ${currentResultData.tikitaka}`;
      document.getElementById('res-tiki-desc').innerText = currentResultData.tikitakaChem;

      const tagsContainer = document.getElementById('res-tags');
      tagsContainer.innerHTML = '';
      currentResultData.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = tag;
        tagsContainer.appendChild(span);
      });
    }

    function shareKakao() {
      if (!window.Kakao) {
        alert('카카오 SDK를 불러오지 못했습니다.');
        return;
      }
    
      const data = currentResultData || results.chiikawa;
      const siteUrl = window.location.href;
      const absoluteImageUrl = new URL(data.img, window.location.href).href;
    
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `나와 닮은 먼작귀 캐릭터는 '${data.name}'!`,
          description: `${data.title}\n"${data.quote}"`,
          // 기존의 큰 imageUrl을 제거하거나 아래 itemContent와 함께 조율
          imageUrl: absoluteImageUrl,
          imageWidth: 400, // 카카오 권장 최소 규격 조절
          imageHeight: 400,
          link: { mobileWebUrl: siteUrl, webUrl: siteUrl }
        },
        buttons: [
          { title: '나도 테스트해보기', link: { mobileWebUrl: siteUrl, webUrl: siteUrl } }
        ]
      });
    }

    function shareTwitter() {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareFacebook() {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareNaver() {
      window.open(`https://share.naver.com/web/shareView?url=${encodeURIComponent(window.location.href)}&title=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}`, '_blank');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('테스트 링크가 복사되었습니다!');
      }).catch(() => {
        alert('복사에 실패했습니다. 주소창의 링크를 직접 복사해 주세요.');
      });
    }

    function restartTest() {
      currentQ = 0;
      for (let key in charScores) {
        charScores[key] = 0;
      }
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('start-view').style.display = 'block';
    }
  </script>

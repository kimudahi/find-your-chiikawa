<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>먼작귀 심리 테스트</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e3f2fd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 16px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(2, 119, 189, 0.08);
      text-align: center;
      position: relative;
    }

    .start-card { display: block; }
    
    .cover-img-box {
      width: 160px;
      height: 160px;
      margin: 12px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.08));
    }

    .cover-badge {
      display: inline-block;
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .cover-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .cover-desc {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .quiz-card { display: none; }

    .progress-container {
      width: 100%;
      background-color: #e1f5fe;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #039be5;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 13px;
      color: #0277bd;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .btn-option {
      width: 100%;
      background-color: #f8f9fa;
      border: 1.5px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.35;
      word-break: keep-all;
      text-align: left;
    }

    .btn-option:active, .btn-option:hover {
      background-color: #e1f5fe;
      border-color: #b3e5fc;
      color: #0277bd;
    }

    .result-card { display: none; }

    .char-img-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(2, 119, 189, 0.15));
    }

    .sub-title { font-size: 14px; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
    .main-title { font-size: 26px; color: #1a1a1a; font-weight: 800; margin-bottom: 12px; }

    .tag-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
    }

    /* 명대사 카드 전면 개편 스타일 (테두리 카드 형태) */
    .quote-box {
      background-color: #f0f9ff !important;
      border: 2px solid #0288d1 !important;
      border-radius: 18px !important;
      padding: 16px 20px !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      color: #01579b !important;
      margin-bottom: 18px !important;
      text-align: center !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.08) !important;
    }

    .summary-text {
      font-size: 14px;
      line-height: 1.65;
      color: #374151;
      margin-bottom: 22px;
      word-break: keep-all;
      text-align: left;
    }

    /* 행운의 아이템 & 힐링 푸드 2컬럼 반반 섹션 */
    .info-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-item {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-label {
      font-size: 12px;
      font-weight: 800;
      color: #0277bd;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .info-value {
      font-size: 13.5px;
      color: #1f2937;
      font-weight: 700;
      word-break: keep-all;
    }

    .chemistry-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .chem-box { border-radius: 16px; padding: 14px 16px; text-align: left; }
    .chem-box.best { background-color: #f0fdf4; border: 1px solid #bbf7d0; }
    .chem-box.tikitaka { background-color: #fff1f2; border: 1px solid #fecdd3; }
    .chem-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .chem-box.best .chem-title { color: #166534; }
    .chem-box.tikitaka .chem-title { color: #9f1239; }
    .chem-desc { font-size: 13px; color: #374151; line-height: 1.4; }

    .share-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main-share {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main-share:active { transform: scale(0.98); }
    
    .btn-kakao-primary { background-color: #FEE500; color: #191919; }
    .btn-link-primary { background-color: #039be5; color: #ffffff; }

    .btn-restart {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      background-color: #e1f5fe;
      color: #0277bd;
      border: none;
      cursor: pointer;
    }

    .sub-sns-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-sub-sns {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .btn-sub-sns:active { transform: scale(0.92); }
    .btn-sub-sns svg { width: 20px; height: 20px; fill: currentColor; }

    .btn-sub-sns.twitter { background-color: #000000; color: #ffffff; }
    .btn-sub-sns.facebook { background-color: #1877f2; color: #ffffff; }
    .btn-sub-sns.naver { background-color: #03cf5d; color: #ffffff; }

    @media (max-width: 380px) {
      .container { padding: 24px 16px; }
      .cover-title { font-size: 21px; }
      .q-text { font-size: 16px; }
      .main-title { font-size: 22px; }
      .btn-option { padding: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-view" class="start-card">
      <span class="cover-badge">먼작귀 성향 테스트</span>
      <h1 class="cover-title">나와 꼭 닮은<br>먼작귀 캐릭터 찾기</h1>
      <div class="cover-img-box">
        <img src="./main.gif" alt="먼작귀 커버">
      </div>
      <p class="cover-desc">4가지 선택지로 더 정밀해진 테스트!<br>나와 매칭되는 먼작귀 캐릭터는 누구일까요?</p>
      <button class="btn-main-share btn-link-primary" onclick="startTest()">테스트 시작하기</button>
    </div>

    <div id="quiz-view" class="quiz-card">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="q-number" id="q-number">Q1</div>
      <div class="q-text" id="q-text">질문 텍스트</div>
      <div id="answer-buttons"></div>
    </div>

    <div id="result-view" class="result-card">
      <div class="char-img-box">
        <img id="res-img" src="" alt="캐릭터 이미지">
      </div>
      <p class="sub-title" id="res-sub"></p>
      <h1 class="main-title" id="res-name"></h1>
      <div class="tag-container" id="res-tags"></div>
      <div class="quote-box" id="res-quote"></div>
      <p class="summary-text" id="res-summary"></p>

      <!-- 왼쪽/오른쪽 반반 섹션 구성 -->
      <div class="info-section">
        <div class="info-item">
          <span class="info-label">🍀 행운의 아이템</span>
          <p class="info-value" id="res-item"></p>
        </div>
        <div class="info-item">
          <span class="info-label">🍮 힐링 푸드</span>
          <p class="info-value" id="res-food"></p>
        </div>
      </div>

      <div class="chemistry-section">
        <div class="chem-box best">
          <div class="chem-title" id="res-best-title"></div>
          <div class="chem-desc">서로를 가장 따뜻하게 챙겨주는 환상의 힐링 조합</div>
        </div>
        <div class="chem-box tikitaka">
          <div class="chem-title" id="res-tiki-title"></div>
          <div class="chem-desc" id="res-tiki-desc"></div>
        </div>
      </div>

      <div class="share-section">
        <button class="btn-main-share btn-kakao-primary" onclick="shareKakao()">
          💬 카카오톡 결과 공유
        </button>
        <button class="btn-main-share btn-link-primary" onclick="copyLink()">
          🔗 테스트 링크 복사
        </button>
        <button class="btn-restart" onclick="restartTest()">↺ 다시 테스트하기</button>

        <div class="sub-sns-group">
          <button class="btn-sub-sns twitter" onclick="shareTwitter()" title="X(트위터) 공유">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </button>
          <button class="btn-sub-sns facebook" onclick="shareFacebook()" title="페이스북 공유">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <button class="btn-sub-sns naver" onclick="shareNaver()" title="네이버 공유">
            <svg viewBox="0 0 24 24"><path d="M16.273 12.845L7.376 0H0v24h7.726v-12.845L16.624 24H24V0h-7.727z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const JAVASCRIPT_KEY = '45851354763e4eb82596527c8f662c33';

    if (window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(JAVASCRIPT_KEY);
    }

    const questions = [
      {
        q: "주말 휴일에 주로 무엇을 하며 보내나요?",
        a: [
          { text: "아늑한 방에서 혼자 조용히 휴식을 취한다.", score: ["chiikawa", "ode"] },
          { text: "독서나 공부 등 나만의 취미에 집중한다.", score: ["kani", "shisa"] },
          { text: "맛있는 음식이나 음식을 곁들인 한잔을 즐긴다.", score: ["kurimanju", "rakko"] },
          { text: "친구들과 만나 활기차게 바깥 활동을 한다.", score: ["hachiware", "usagi", "momonga"] }
        ]
      },
      {
        q: "갑자기 난이도 높은 과제나 목표가 생겼을 때 나의 행동은?",
        a: [
          { text: "겁부터 나지만 마음을 다잡고 차근차근 마주한다.", score: ["chiikawa", "hachiware"] },
          { text: "자격증이나 시험 통과를 위해 밤낮없이 노력한다.", score: ["shisa", "rakko"] },
          { text: "관련된 자료나 책을 찾아보며 조용히 준비한다.", score: ["kani"] },
          { text: "기분 내키는 대로 자유롭고 임기응변으로 해결한다.", score: ["usagi", "momonga", "ode"] }
        ]
      },
      {
        q: "친구들과 여럿이 모여 있을 때 내 성향은?",
        a: [
          { text: "친구들의 이야기를 밝게 들어주고 사진도 남긴다.", score: ["hachiware"] },
          { text: "말수는 적지만 필요할 때 묵직하게 뒤를 지켜준다.", score: ["ode", "kani"] },
          { text: "자신의 매력을 당당히 발산하며 관심을 즐긴다.", score: ["momonga", "usagi"] },
          { text: "어른스럽게 주변을 챙기며 중심을 잡아준다.", score: ["kurimanju", "rakko"] }
        ]
      },
      {
        q: "가장 보람을 느끼거나 뿌듯한 순간은 언제인가요?",
        a: [
          { text: "나의 성과나 노력을 주변에서 크게 인정받을 때", score: ["shisa", "momonga"] },
          { text: "내가 정성껏 준비한 지식이나 도움을 나눴을 때", score: ["kani", "hachiware"] },
          { text: "어려운 단련을 이겨내고 스스로 성장했음을 느낄 때", score: ["rakko"] },
          { text: "좋아하는 이들과 맛있는 걸 먹으며 편히 쉴 때", score: ["kurimanju", "chiikawa"] }
        ]
      },
      {
        q: "누군가 나를 기분 좋게 칭찬해 준다면?",
        a: [
          { text: "“더 칭찬해 줘!” 하고 당당하게 기뻐한다.", score: ["momonga"] },
          { text: "쑥스러워서 얼굴이 빨개지지만 속으로 무척 기쁘다.", score: ["chiikawa", "kani"] },
          { text: "“우레시-!” 예의 바르고 열정적으로 감사 인사를 한다.", score: ["shisa"] },
          { text: "덤덤하게 미소를 지으며 고마움을 표한다.", score: ["rakko", "ode", "kurimanju"] }
        ]
      },
      {
        q: "일상에서 스트레스가 쌓였을 때 나만의 해소법은?",
        a: [
          { text: "시원한 음료와 정갈한 안주로 혼자만의 시간 갖기", score: ["kurimanju"] },
          { text: "소리를 지르거나 몸을 움직여 에너지를 발산하기", score: ["usagi"] },
          { text: "달콤한 디저트를 먹으며 멘탈 관리하기", score: ["rakko", "chiikawa"] },
          { text: "조용한 곳에서 책을 읽거나 풍경을 바라보기", score: ["kani", "ode"] }
        ]
      },
      {
        q: "낯선 사람들과 어울려야 하는 모임에 갔을 때 나는?",
        a: [
          { text: "먼저 인사를 건네며 붙싹성 있게 분위기를 푼다.", score: ["hachiware", "shisa"] },
          { text: "구석에서 조심스럽게 상황을 살피며 적응한다.", score: ["chiikawa", "kani"] },
          { text: "묵묵히 자기 자리를 지키며 조용히 존재감을 드러낸다.", score: ["ode"] },
          { text: "남들 시선 상관없이 원하는 대로 행동한다.", score: ["usagi", "momonga"] }
        ]
      },
      {
        q: "여행을 떠날 때 선호하는 계획 스타일은?",
        a: [
          { text: "시간표부터 맛집 목록까지 꼼꼼히 체크한다.", score: ["shisa", "kani"] },
          { text: "큰 동선만 정해두고 상황에 맞게 즐긴다.", score: ["hachiware", "rakko"] },
          { text: "그날의 느낌과 맛있는 음식에 끌리는 대로 움직인다.", score: ["kurimanju", "ode"] },
          { text: "발길 닿는 대로 즉흥 탐험을 시작한다.", score: ["usagi", "momonga"] }
        ]
      },
      {
        q: "소중한 사람에게 내 마음을 표현하는 방식은?",
        a: [
          { text: "따뜻한 말 한마디와 사진으로 추억을 만들어준다.", score: ["hachiware", "chiikawa"] },
          { text: "말없이 묵직하게 뒤에서 큰 힘이 되어준다.", score: ["ode", "rakko"] },
          { text: "작은 선물이나 유용한 지식을 살포시 전해준다.", score: ["kani", "shisa"] },
          { text: "애교나 투정을 부리며 친근감을 표시한다.", score: ["momonga", "usagi"] }
        ]
      },
      {
        q: "내가 생각하는 나의 가장 매력적인 면모는?",
        a: [
          { text: "순수하고 따뜻해서 보호본능을 자극하는 점", score: ["chiikawa"] },
          { text: "남을 잘 챙겨주고 항상 긍정적인 에너지를 주는 점", score: ["hachiware", "shisa"] },
          { text: "어디로 튈지 모르는 엉뚱함과 뛰어난 순발력", score: ["usagi"] },
          { text: "차분하고 깊은 생각으로 든든한 버팀목이 되는 점", score: ["kani", "ode", "kurimanju"] }
        ]
      }
    ];

    /* 각 캐릭터 설명글을 최소 3줄 이상으로 풍성하게 구성 */
    const results = {
      chiikawa: {
        name: "치이카와", title: "소심하지만 용기 내는 순수파",
        tags: ["#순수함", "#소심하지만_용감해", "#귀여움"],

    let currentQ = 0;
    let charScores = {
      chiikawa: 0, hachiware: 0, usagi: 0,
      momonga: 0, kurimanju: 0, rakko: 0,
      shisa: 0, kani: 0, ode: 0
    };
    let currentResultData = null;

    function startTest() {
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('q-number').innerText = `Q${currentQ + 1}`;
      document.getElementById('q-text').innerText = q.q;
      document.getElementById('progress-bar').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const btnContainer = document.getElementById('answer-buttons');
      btnContainer.innerHTML = '';

      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${idx + 1}. ${ans.text}`;
        btn.onclick = () => selectAnswer(ans.score);
        btnContainer.appendChild(btn);
      });
    }

    function selectAnswer(targetChars) {
      targetChars.forEach(charKey => {
        if (charScores[charKey] !== undefined) {
          charScores[charKey] += 1;
        }
      });

      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      let maxScore = -1;
      let topChars = [];

      for (let charKey in charScores) {
        if (charScores[charKey] > maxScore) {
          maxScore = charScores[charKey];
          topChars = [charKey];
        } else if (charScores[charKey] === maxScore) {
          topChars.push(charKey);
        }
      }

      const selectedCharKey = topChars[Math.floor(Math.random() * topChars.length)];
      currentResultData = results[selectedCharKey] || results.chiikawa;

      document.getElementById('res-img').src = currentResultData.img;
      document.getElementById('res-sub').innerText = currentResultData.title;
      document.getElementById('res-name').innerText = currentResultData.name;
      document.getElementById('res-quote').innerText = currentResultData.quote;
      document.getElementById('res-summary').innerText = currentResultData.summary;
      document.getElementById('res-item').innerText = currentResultData.item;
      document.getElementById('res-food').innerText = currentResultData.food;
      document.getElementById('res-best-title').innerText = `💖 BEST 짝꿍: ${currentResultData.best}`;
      document.getElementById('res-tiki-title').innerText = `⚡ 환장의 티키타카: ${currentResultData.tikitaka}`;
      document.getElementById('res-tiki-desc').innerText = currentResultData.tikitakaChem;

      const tagsContainer = document.getElementById('res-tags');
      tagsContainer.innerHTML = '';
      currentResultData.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = tag;
        tagsContainer.appendChild(span);
      });
    }

    function shareKakao() {
      if (!window.Kakao) {
        alert('카카오 SDK를 불러오지 못했습니다.');
        return;
      }

      const data = currentResultData || results.chiikawa;
      const siteUrl = window.location.href;

      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `나와 닮은 먼작귀 캐릭터는 '${data.name}'!`,
          description: `${data.title}\n"${data.quote}"`,
          imageUrl: data.img,
          link: { mobileWebUrl: siteUrl, webUrl: siteUrl }
        },
        buttons: [
          { title: '나도 테스트해보기', link: { mobileWebUrl: siteUrl, webUrl: siteUrl } }
        ]
      });
    }

    function shareTwitter() {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareFacebook() {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareNaver() {
      window.open(`https://share.naver.com/web/shareView?url=${encodeURIComponent(window.location.href)}&title=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}`, '_blank');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('테스트 링크가 복사되었습니다!');
      }).catch(() => {
        alert('복사에 실패했습니다. 주소창의 링크를 직접 복사해 주세요.');
      });
    }

    function restartTest() {
      currentQ = 0;
      for (let key in charScores) {
        charScores[key] = 0;
      }
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('start-view').style.display = 'block';
    }
  </script>

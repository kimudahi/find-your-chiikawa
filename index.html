<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치이카와 캐릭터 성향 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .progress {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      margin-bottom: 8px;
    }
    .question {
      font-size: 18px;
      font-weight: 700;
      color: #222;
      margin-bottom: 20px;
      word-break: keep-all;
      line-height: 1.4;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-option {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 14px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
    }
    .btn-option:hover {
      background: #f0f7ff;
      border-color: #3b82f6;
    }
    .result-box {
      text-align: center;
    }
    .result-title {
      font-size: 22px;
      font-weight: 800;
      color: #111;
      margin-bottom: 12px;
    }
    .result-desc {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-restart {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <!-- Dynamic Rendering -->
</div>

<script>
// 1. 캐릭터 기본 데이터 (9명)
const characters = {
  chiikawa: { name: "치이카와", desc: "겁이 많고 눈물도 많지만, 중요한 순간에는 끝까지 포기하지 않는 용기를 가진 타입입니다." },
  hachiware: { name: "하치와레", desc: "긍정적인 마인드로 주변을 밝게 만들고, 기쁨과 맛있는 것을 함께 나누길 좋아하는 다정한 타입입니다." },
  usagi: { name: "우사기", desc: "남들의 시선은 신경 쓰지 않는 독보적인 마이웨이! 자유롭고 압도적인 텐션을 자랑하는 타입입니다." },
  momonga: { name: "모몽가", desc: "언제나 내가 주인공! 귀여움과 칭찬을 독차지하고 싶어 하는 당당한 어리광쟁이 타입입니다." },
  kurimanju: { name: "쿠리만쥬", desc: "하루의 끝을 깔끔한 여유와 맛있는 음식으로 마무리하는, 덤덤하고 어른스러운 타입입니다." },
  rakko: { name: "랏코", desc: "스스로에게 엄격하며 실력을 키워 남들에게 동경을 받는 미식가이자 베테랑 타입입니다." },
  shisa: { name: "시사", desc: "성실하고 예의 바르며, 자격증 공부나 목표 달성을 위해 꾸준히 노력하는 모범생 타입입니다." },
  kani: { name: "카니", desc: "조용히 주변을 살피며, 애정하는 사람에게 다정하게 마음을 쏟아주는 조력자 타입입니다." },
  ode: { name: "오데", desc: "커다란 울타리처럼 다 함께 어울리는 환경을 만들고, 기꺼이 든든한 버팀목이 되어주는 타입입니다." }
};

// 2. 9개 공평 문항 (문항당 1명의 targetChar에게만 가중치 +2점 부여)
const questions = [
  {
    targetChar: "chiikawa",
    q: "Q1. 정말 막막하고 두려운 상황이 눈앞에 찾아왔을 때 나는?",
    a: [
      { text: "겁이 나서 눈물이 나지만 끝까지 용기를 내서 부딪힌다.", char: "chiikawa" },
      { text: "어떻게든 될 거라며 웃으며 상황을 이겨낸다.", char: "hachiware" },
      { text: "알 수 없는 함성을 지르며 무작정 돌진한다.", char: "usagi" },
      { text: "상황을 회피하거나 누군가의 뒤로 쏙 숨는다.", char: "momonga" }
    ]
  },
  {
    targetChar: "hachiware",
    q: "Q2. 맛있는 음식이나 기분 좋은 소식을 접했을 때 나의 반응은?",
    a: [
      { text: "가장 먼저 소중한 사람들에게 나누며 함께 기뻐한다.", char: "hachiware" },
      { text: "혼자만의 공간에서 조용히 음미하며 힐링한다.", char: "kurimanju" },
      { text: "성취감을 느끼며 스스로에게 상을 준다.", char: "rakko" },
      { text: "주변 친구들에게 자랑하며 칭찬을 요구한다.", char: "momonga" }
    ]
  },
  {
    targetChar: "usagi",
    q: "Q3. 특별한 계획이 없는 주말, 나만의 행동 스타일은?",
    a: [
      { text: "발길 닿는 대로, 내키는 대로 자유롭게 밖을 돌아다닌다.", char: "usagi" },
      { text: "집에서 폭신한 이불을 덮고 느긋하게 휴식을 취한다.", char: "chiikawa" },
      { text: "미뤄뒀던 공부나 자기계발 계획을 세운다.", char: "shisa" },
      { text: "좋아하는 사람의 일상에 맞춰 소소하게 도와준다.", char: "kani" }
    ]
  },
  {
    targetChar: "momonga",
    q: "Q4. 여러 사람과 함께 모여 있을 때 내가 바라는 내 모습은?",
    a: [
      { text: "모두의 관심과 귀여움을 독차지하는 귀염둥이!", char: "momonga" },
      { text: "다 함께 웃고 떠들 수 있도록 분위기를 이끄는 리더.", char: "hachiware" },
      { text: "조용히 구석에서 상황을 관찰하며 챙겨주는 존재.", char: "kani" },
      { text: "모두를 포용하고 지켜주는 든든한 버팀목.", char: "ode" }
    ]
  },
  {
    targetChar: "kurimanju",
    q: "Q5. 힘든 하루 일을 모두 마치고 집으로 돌아왔을 때 가장 필요한 것은?",
    a: [
      { text: "시원한 음료와 안주를 곁들인 혼자만의 느긋한 시간.", char: "kurimanju" },
      { text: "따뜻한 욕조에 들어가 마음을 정돈하는 조용한 시간.", char: "shisa" },
      { text: "친구들과 전화로 수다 떨며 스트레스를 푸는 시간.", char: "hachiware" },
      { text: "아무 생각 없이 제일 맛있는 음식을 잔뜩 먹는 것.", char: "usagi" }
    ]
  },
  {
    targetChar: "rakko",
    q: "Q6. 내가 생각하는 가장 멋진 인간상이란?",
    a: [
      { text: "꾸준히 실력을 쌓아 남들에게 인정받는 완벽한 전문가.", char: "rakko" },
      { text: "어떤 시련이 와도 다시 일어서는 마음이 강한 사람.", char: "chiikawa" },
      { text: "남들을 위해 기꺼이 희생할 줄 아는 배려심 깊은 사람.", char: "ode" },
      { text: "구속받지 않고 내 방식대로 당당하게 사는 사람.", char: "usagi" }
    ]
  },
  {
    targetChar: "shisa",
    q: "Q7. 새로운 도전이나 공부를 시작할 때 나의 마음가짐은?",
    a: [
      { text: "자격증이나 확실한 성과를 낼 때까지 성실하게 노력한다.", char: "shisa" },
      { text: "즐겁고 유익한 경험이 되는 것에 의의를 둔다.", char: "hachiware" },
      { text: "목표를 높게 잡고 멋진 결과를 이뤄내 스승처럼 성장한다.", char: "rakko" },
      { text: "굳이 스트레스받지 않고 할 수 있는 만큼만 편하게 한다.", char: "kurimanju" }
    ]
  },
  {
    targetChar: "kani",
    q: "Q8. 내가 좋아하는 사람에게 마음을 전하는 가장 좋은 방법은?",
    a: [
      { text: "상대방이 필요한 것을 세심하게 챙겨주고 다정하게 대해준다.", char: "kani" },
      { text: "함께 맛있는 것을 먹으러 가자고 먼저 손을 내민다.", char: "hachiware" },
      { text: "귀엽게 어리광을 부리며 애정을 요구한다.", char: "momonga" },
      { text: "묵묵히 옆을 지켜주며 상대방의 편이 되어준다.", char: "ode" }
    ]
  },
  {
    targetChar: "ode",
    q: "Q9. 누군가 억울한 일을 당하거나 도움이 필요한 순간을 목격했다면?",
    a: [
      { text: "내 일처럼 앞장서서 상대를 두텁게 보호하고 지켜준다.", char: "ode" },
      { text: "침착하게 상황을 분석하고 바른 해결책을 찾아준다.", char: "shisa" },
      { text: "안절부절못하며 같이 슬퍼하고 응원해 준다.", char: "chiikawa" },
      { text: "내가 가진 팁이나 소중한 무언가를 내어준다.", char: "hachiware" }
    ]
  }
];

// 3. 상태 변수
let currentQ = 0;
let charScores = {
  chiikawa: 0, hachiware: 0, usagi: 0, momonga: 0,
  kurimanju: 0, rakko: 0, shisa: 0, kani: 0, ode: 0
};
let userAnswers = []; // 각 질문별 사용자가 고른 캐릭터 저장

// 4. 질문 화면 렌더링
function renderQuestion() {
  const app = document.getElementById("app");
  const qData = questions[currentQ];

  let optionsHtml = qData.a.map((opt, idx) => `
    <button class="btn-option" onclick="handleSelect('${opt.char}')">
      ${opt.text}
    </button>
  `).join('');

  app.innerHTML = `
    <div class="progress">질문 ${currentQ + 1} / ${questions.length}</div>
    <div class="question">${qData.q}</div>
    <div class="options">${optionsHtml}</div>
  `;
}

// 5. 답변 선택 및 점수 합산
function handleSelect(selectedChar) {
  const currentQuestionData = questions[currentQ];

  // 가중치 산출: 해당 문항의 시그니처 캐릭터면 +2점, 아니면 +1점
  const addedScore = (selectedChar === currentQuestionData.targetChar) ? 2 : 1;
  charScores[selectedChar] += addedScore;

  // 타이브레이커 판정을 위한 사용자 응답 저장
  userAnswers[currentQ] = selectedChar;

  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

// 6. 결과 산출 및 타이브레이커 로직
function showResult() {
  let maxScore = -1;

  // 최고 점수 찾기
  for (let charKey in charScores) {
    if (charScores[charKey] > maxScore) {
      maxScore = charScores[charKey];
    }
  }

  // 최고 점수 동점자 수집
  const topChars = Object.keys(charScores).filter(
    charKey => charScores[charKey] === maxScore
  );

  let finalChar = topChars[0];

  // [타이브레이커 작동] 동점자가 2명 이상인 경우
  if (topChars.length > 1) {
    let resolved = false;

    // 1차: 동점자 중 '자신의 시그니처 문항(+2점)'에서 고름을 받은 캐릭터 선출
    for (let charKey of topChars) {
      // 해당 캐릭터가 targetChar였던 질문의 인덱스 탐색
      const targetQuestionIdx = questions.findIndex(q => q.targetChar === charKey);
      
      // 사용자가 그 질문에서 실제로 해당 캐릭터를 선택했는지 확인
      if (targetQuestionIdx !== -1 && userAnswers[targetQuestionIdx] === charKey) {
        finalChar = charKey;
        resolved = true;
        break;
      }
    }

    // 2차: 시그니처 문항 선택으로도 안 풀릴 경우, 앞선 질문(Q1~)에서 먼저 고른 캐릭터 선택
    if (!resolved) {
      for (let i = 0; i < userAnswers.length; i++) {
        if (topChars.includes(userAnswers[i])) {
          finalChar = userAnswers[i];
          break;
        }
      }
    }
  }

  // 결과 화면 출력
  renderResult(finalChar);
}

// 7. 결과 화면 렌더링
function renderResult(charKey) {
  const app = document.getElementById("app");
  const resultData = characters[charKey];

  app.innerHTML = `
    <div class="result-box">
      <div class="progress">당신의 치이카와 성향은?</div>
      <div class="result-title">${resultData.name}</div>
      <div class="result-desc">${resultData.desc}</div>
      <button class="btn-restart" onclick="restartTest()">다시 테스트하기</button>
    </div>
  `;
}

// 8. 테스트 초기화
function restartTest() {
  currentQ = 0;
  userAnswers = [];
  for (let charKey in charScores) {
    charScores[charKey] = 0;
  }
  renderQuestion();
}

// 최초 실행
renderQuestion();
</script>
</body>
</html>

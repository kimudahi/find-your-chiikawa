<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>먼작귀 심리 테스트</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e3f2fd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 16px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(2, 119, 189, 0.08);
      text-align: center;
      position: relative;
    }

    .start-card { display: block; }
    
    /* 동그라미 프레임 제거, 누끼 이미지 전용 박스 */
    .cover-img-box {
      width: 160px;
      height: 160px;
      margin: 12px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.08));
    }

    .cover-badge {
      display: inline-block;
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .cover-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .cover-desc {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .quiz-card { display: none; }

    .progress-container {
      width: 100%;
      background-color: #e1f5fe;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #039be5;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 13px;
      color: #0277bd;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .btn-option {
      width: 100%;
      background-color: #f8f9fa;
      border: 1.5px solid #e9ecef;
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.35;
      word-break: keep-all;
      text-align: left;
    }

    .btn-option:active, .btn-option:hover {
      background-color: #e1f5fe;
      border-color: #b3e5fc;
      color: #0277bd;
    }

    .result-card { display: none; }

    /* 결과 캐릭터 원형 배경 및 테두리 제거 */
    .char-img-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(2, 119, 189, 0.15));
    }

    .sub-title { font-size: 14px; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
    .main-title { font-size: 26px; color: #1a1a1a; font-weight: 800; margin-bottom: 12px; }

    .tag-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      background-color: #e1f5fe;
      color: #0277bd;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
    }

    .quote-box {
      background-color: #f2faff;
      border-left: 4px solid #039be5;
      padding: 12px 16px;
      border-radius: 6px 14px 14px 6px;
      font-size: 14px;
      font-weight: 700;
      color: #4a4a4a;
      margin-bottom: 18px;
      text-align: left;
    }

    .summary-text {
      font-size: 14px;
      line-height: 1.6;
      color: #4a4a4a;
      margin-bottom: 22px;
      word-break: keep-all;
      text-align: left;
    }

    .info-section {
      background-color: #f8f9fa;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .info-item { margin-bottom: 8px; }
    .info-item:last-child { margin-bottom: 0; }
    .info-label { font-size: 12px; font-weight: 800; color: #0277bd; display: block; margin-bottom: 2px; }
    .info-value { font-size: 14px; color: #2c2c2e; font-weight: 600; }

    .chemistry-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .chem-box { border-radius: 16px; padding: 14px 16px; text-align: left; }
    .chem-box.best { background-color: #f0fdf4; border: 1px solid #bbf7d0; }
    .chem-box.tikitaka { background-color: #fff1f2; border: 1px solid #fecdd3; }
    .chem-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .chem-box.best .chem-title { color: #166534; }
    .chem-box.tikitaka .chem-title { color: #9f1239; }
    .chem-desc { font-size: 13px; color: #374151; line-height: 1.4; }

    .share-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn-main-share {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main-share:active { transform: scale(0.98); }
    
    .btn-kakao-primary { background-color: #FEE500; color: #191919; }
    .btn-link-primary { background-color: #039be5; color: #ffffff; }

    .sub-sns-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-sub-sns {
      padding: 12px 0;
      border-radius: 12px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sub-sns.twitter { background-color: #000000; color: #ffffff; }
    .btn-sub-sns.facebook { background-color: #1877f2; color: #ffffff; }
    .btn-sub-sns.naver { background-color: #03cf5d; color: #ffffff; }

    .btn-restart {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      background-color: #e1f5fe;
      color: #0277bd;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }

    @media (max-width: 380px) {
      .container { padding: 24px 16px; }
      .cover-title { font-size: 21px; }
      .q-text { font-size: 16px; }
      .main-title { font-size: 22px; }
      .btn-option { padding: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-view" class="start-card">
      <span class="cover-badge">먼작귀 성향 테스트</span>
      <h1 class="cover-title">나와 꼭 닮은<br>먼작귀 캐릭터 찾기</h1>
      <div class="cover-img-box">
        <img src="./main.gif" alt="먼작귀 커버">
      </div>
      <p class="cover-desc">4가지 선택지로 더 정밀해진 테스트!<br>나와 매칭되는 먼작귀 캐릭터는 누구일까요?</p>
      <button class="btn-main-share btn-link-primary" onclick="startTest()">테스트 시작하기</button>
    </div>

    <div id="quiz-view" class="quiz-card">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="q-number" id="q-number">Q1</div>
      <div class="q-text" id="q-text">질문 텍스트</div>
      <div id="answer-buttons"></div>
    </div>

    <div id="result-view" class="result-card">
      <div class="char-img-box">
        <img id="res-img" src="" alt="캐릭터 이미지">
      </div>
      <p class="sub-title" id="res-sub"></p>
      <h1 class="main-title" id="res-name"></h1>
      <div class="tag-container" id="res-tags"></div>
      <div class="quote-box" id="res-quote"></div>
      <p class="summary-text" id="res-summary"></p>

      <div class="info-section">
        <div class="info-item">
          <span class="info-label">🍀 행운의 아이템</span>
          <p class="info-value" id="res-item"></p>
        </div>
        <div class="info-item">
          <span class="info-label">🍮 힐링 푸드</span>
          <p class="info-value" id="res-food"></p>
        </div>
      </div>

      <div class="chemistry-section">
        <div class="chem-box best">
          <div class="chem-title" id="res-best-title"></div>
          <div class="chem-desc">서로를 가장 따뜻하게 챙겨주는 환상의 힐링 조합</div>
        </div>
        <div class="chem-box tikitaka">
          <div class="chem-title" id="res-tiki-title"></div>
          <div class="chem-desc" id="res-tiki-desc"></div>
        </div>
      </div>

      <div class="share-section">
        <button class="btn-main-share btn-kakao-primary" onclick="shareKakao()">
          💬 카카오톡 결과 공유
        </button>
        <button class="btn-main-share btn-link-primary" onclick="copyLink()">
          🔗 테스트 링크 복사
        </button>

        <div class="sub-sns-group">
          <button class="btn-sub-sns twitter" onclick="shareTwitter()">X(트위터)</button>
          <button class="btn-sub-sns facebook" onclick="shareFacebook()">페이스북</button>
          <button class="btn-sub-sns naver" onclick="shareNaver()">네이버</button>
        </div>
        <button class="btn-restart" onclick="restartTest()">↺ 다시 테스트하기</button>
      </div>
    </div>
  </div>

  <script>
    const JAVASCRIPT_KEY = '45851354763e4eb82596527c8f662c33';

    if (window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(JAVASCRIPT_KEY);
    }

    // 4개의 디테일한 선택지로 구성된 10문항
    const questions = [
      {
        q: "주말 휴일에 주로 무엇을 하며 보내나요?",
        a: [

          { text: "기분 내키는 대로 자유롭고 임기응변으로 해결한다.", score: ["usagi", "momonga", "ode"] }
        ]
      },
      {
        q: "친구들과 여럿이 모여 있을 때 내 성향은?",

          { text: "친구들의 이야기를 밝게 들어주고 사진도 남긴다.", score: ["hachiware"] },

      },
      {
        q: "가장 보람을 느끼거나 뿌듯한 순간은 언제인가요?",
        a: [
          { text: "나의 성과나 노력을 주변에서 크게 인정받을 때", score: ["shisa", "momonga"] },
          { text: "내가 정성껏 준비한 지식이나 도움을 나눴을 때", score: ["kani", "hachiware"] },

      {

      },
      {

    // 업로드된 GitHub 이미지 파일명 일치

      chiikawa: {

        best: "하치와레", tikitaka: "고블린",
        tikitakaChem: "상대의 규칙을 신나게 깨부수는 해프닝 조합!"
      },
      momonga: {
        name: "모몬가", title: "귀여움을 무기로 삼는 악동",
        tags: ["#귀여움독점", "#뻔뻔함", "#관심집중"],
        quote: "“귀여워해라! 칭찬해라!”",
        img: "./momonga.png",
        summary: "자신의 매력을 잘 알고 있으며, 당당하게 애정을 요구하지만 미워할 수 없는 매력이 있습니다.",
        item: "폭신 꼬리 빗", food: "갓 구운 핫케이크",
        best: "카니", tikitaka: "랏코",
        tikitakaChem: "아무리 애교를 부려도 랏코의 진지함 앞에 작아지는 조합!"
      },
      kurimanju: {
        name: "쿠리만쥬", title: "여유를 즐기는 낭만 미식가",
        tags: ["#어른미식가", "#여유로움", "#혼술낭만"],
        quote: "“하아아아-! (크아-)”",
        img: "./kurimanju.png",
        summary: "맛있는 음식과 음료 한 잔으로 힐링하는, 느긋하고 어른스러운 성향의 소유자입니다.",
        item: "휴대용 텀블러", food: "구운 오징어 다리",
        best: "시사", tikitaka: "우사기",
        tikitakaChem: "조용히 여유를 즐기고 싶은데 옆에서 시끄럽게 구는 조합!"
      },
      rakko: {
        name: "랏코", title: "철저한 자기관리의 완벽주의자",
        tags: ["#실력파", "#반전매력", "#카리스마"],
        quote: "“기억해 둬라... 이 맛을.”",
        img: "./rakko.png",
        summary: "최고의 자리에 오른 능력자! 카리스마 넘치는 모습 뒤에 디저트를 사랑하는 반전이 있습니다.",
        item: "토벌 1위의 검", food: "딸기 파르페",
        best: "시사", tikitaka: "모몬가",
        tikitakaChem: "엄격하게 가르치려 해도 게으름 피우는 모습에 난감해하는 조합!"
      },
      shisa: {
        name: "시사", title: "성실함과 예의를 갖춘 노력파",
        tags: ["#열정파", "#자격증수집", "#예의바름"],
        quote: "“우레시-! (기뻐요!)”",
        img: "./shisa.png",
        summary: "목표를 세우면 밤낮없이 노력하여 성과를 내는 성실함과 예의를 갖춘 모범생 스타일입니다.",
        item: "슈퍼 알바 자격증", food: "특제 라멘",
        best: "쿠리만쥬", tikitaka: "모몬가",
        tikitakaChem: "일터에서 뻔뻔하게 응석을 부려 난감해지는 조합!"
      },
      kani: {
        name: "카니 (중고서점)", title: "조용하고 따뜻한 지성파",
        tags: ["#책방주인", "#은근한배려", "#차분함"],
        quote: "“...이 책, 읽어볼래?”",
        img: "./kani.png",
        summary: "차분하게 자신의 자리를 지키며, 다정한 배려심으로 주변을 따뜻하게 챙깁니다.",

        best: "모몬가", tikitaka: "우사기",
        tikitakaChem: "조용한 서점에 불쑥 찾아와 장난치는 우사기 때문에 당황하는 조합!"
      },
      ode: {
        name: "오데", title: "묵직하고 신비로운 지키미",
        tags: ["#신비로움", "#묵직한온정", "#든든함"],
        quote: "“너희는... 따뜻한 존재구나.”",
        img: "https://via.placeholder.com/300x300/e1f5fe/0277bd?text=Ode", // 이미지 추가 시 ./ode.png 로 변경
        summary: "말수는 적지만 한번 마음을 준 친구에게는 변함없는 호의와 든든함을 보여줍니다.",
        item: "감옥 열쇠", food: "야채 스튜",
        best: "치이카와", tikitaka: "쿠리만쥬",
        tikitakaChem: "서로 조용히 안부만 건네며 음식을 나누어 먹는 무묵직한 케미!"
      }
    };

    let currentQ = 0;
    let charScores = {
      chiikawa: 0, hachiware: 0, usagi: 0,
      momonga: 0, kurimanju: 0, rakko: 0,
      shisa: 0, kani: 0, ode: 0
    };
    let currentResultData = null;

    function startTest() {
      document.getElementById('start-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      document.getElementById('q-number').innerText = `Q${currentQ + 1}`;
      document.getElementById('q-text').innerText = q.q;
      document.getElementById('progress-bar').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const btnContainer = document.getElementById('answer-buttons');
      btnContainer.innerHTML = '';

      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${idx + 1}. ${ans.text}`;
        btn.onclick = () => selectAnswer(ans.score);
        btnContainer.appendChild(btn);
      });
    }

    function selectAnswer(targetChars) {
      targetChars.forEach(charKey => {
        if (charScores[charKey] !== undefined) {
          charScores[charKey] += 1;
        }
      });

      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      let maxScore = -1;
      let topChars = [];

      for (let charKey in charScores) {
        if (charScores[charKey] > maxScore) {
          maxScore = charScores[charKey];
          topChars = [charKey];
        } else if (charScores[charKey] === maxScore) {
          topChars.push(charKey);
        }
      }

      const selectedCharKey = topChars[Math.floor(Math.random() * topChars.length)];
      currentResultData = results[selectedCharKey] || results.chiikawa;

      document.getElementById('res-img').src = currentResultData.img;
      document.getElementById('res-sub').innerText = currentResultData.title;
      document.getElementById('res-name').innerText = currentResultData.name;
      document.getElementById('res-quote').innerText = currentResultData.quote;
      document.getElementById('res-summary').innerText = currentResultData.summary;
      document.getElementById('res-item').innerText = currentResultData.item;
      document.getElementById('res-food').innerText = currentResultData.food;
      document.getElementById('res-best-title').innerText = `💖 BEST 짝꿍: ${currentResultData.best}`;
      document.getElementById('res-tiki-title').innerText = `⚡ 환상의 티키타카: ${currentResultData.tikitaka}`;
      document.getElementById('res-tiki-desc').innerText = currentResultData.tikitakaChem;

      const tagsContainer = document.getElementById('res-tags');
      tagsContainer.innerHTML = '';
      currentResultData.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = tag;
        tagsContainer.appendChild(span);
      });
    }

    function shareKakao() {
      if (!window.Kakao) {
        alert('카카오 SDK를 불러오지 못했습니다.');
        return;
      }

      const data = currentResultData || results.chiikawa;
      const siteUrl = window.location.href;

      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `나와 닮은 먼작귀 캐릭터는 '${data.name}'!`,
          description: `${data.title}\n"${data.quote}"`,
          imageUrl: data.img,
          link: { mobileWebUrl: siteUrl, webUrl: siteUrl }
        },
        buttons: [
          { title: '나도 테스트해보기', link: { mobileWebUrl: siteUrl, webUrl: siteUrl } }
        ]
      });
    }

    function shareTwitter() {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareFacebook() {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function shareNaver() {
      window.open(`https://share.naver.com/web/shareView?url=${encodeURIComponent(window.location.href)}&title=${encodeURIComponent('나와 꼭 닮은 먼작귀 캐릭터 찾기 테스트!')}`, '_blank');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('테스트 링크가 복사되었습니다!');
      }).catch(() => {
        alert('복사에 실패했습니다. 주소창의 링크를 직접 복사해 주세요.');
      });
    }

    function restartTest() {
      currentQ = 0;
      for (let key in charScores) {
        charScores[key] = 0;
      }
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('start-view').style.display = 'block';
    }
  </script>
</body>
